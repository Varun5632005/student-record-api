spring.application.name=student-record-management

# --- DataSource ---
# When SPRING_DATASOURCE_URL is set (e.g. on Render with PostgreSQL), use that.
# Otherwise fall back to H2 in-memory for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Explicitly set driver so Spring doesn't conflict between H2 and PostgreSQL drivers
# Override to org.postgresql.Driver when SPRING_DATASOURCE_URL points to PostgreSQL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 console — only useful locally; disable in production
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}
